spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

          microsoft:
            client-id: ${MICROSOFT_CLIENT_ID}
            client-secret: ${MICROSOFT_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-name: Microsoft
            provider: azure-ad-provider
        provider:
          azure-ad-provider:
            issuer-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID}/v2.0

#            scope:
#              - openid
#              - profilef
#              - email
#        provider:
#          google:
#            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
#            token-uri: https://oauth2.googleapis.com/token
#            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
  sql:
    init:
      mode: never

  application:
    name: lms

  datasource:

#    url: ${SPRING_LOCAL_DATASOURCE_URL}
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      connection-timeout: 30000 # 30 seconds
      idle-timeout: 600000    # 10 minutes
      max-lifetime: 1800000  # 30 minutes

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  cache:
    type: redis

  data:
    redis:
      url: ${REDIS_URL}
      ssl:
        enabled: true



supabase:
  s3:
    endpoint: ${SUPABASE_S3_ENDPOINT}
    region: ${SUPABASE_S3_REGION}
    access-key: ${SUPABASE_S3_ACCESSKEY}
    secret-key: ${SUPABASE_S3_SECRETKEY}
    bucket: ${SUPABASE_S3_BUCKET}

# For local image path
#image_path: D:/spring/images
frontend_local_url: ${FRONTEND_LOCAL_URL}
frontend_netlify_url: ${FRONTEND_NETLIFY_URL}


